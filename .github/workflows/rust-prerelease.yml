name: Rust Pre Release

on:
  push:
    branches: ["main"]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    uses: ./.github/workflows/shared-build.yml
    with:
      os: ${{ matrix.os }}
      release: true

  docker:
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/shared-docker-publish.yml
    secrets: inherit
    with:
      push: true

  test_github_action:
    needs: docker
    runs-on: ubuntu-latest
    name: Generate example space using github action
    steps:
      - uses: actions/checkout@v5
      - name: Point the action at the image just built from main
        env:
          IMAGE: jamesallanlloyd/marked-space:latest
        run: |
          sed -i "s|^  image: .*|  image: \"docker://$IMAGE\"|" action.yml
          cat action.yml
      - name: Marked Space Test
        id: marked-space-test
        uses: ./
        with:
          space-directory: "example/team"
          confluence-host: ${{ vars.CONFLUENCE_HOST }}
          api-user: ${{ secrets.API_USER }}
          api-token: ${{ secrets.API_TOKEN }}

  create-prerelease:
    permissions: write-all
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download ubuntu
        uses: actions/download-artifact@v7
        with:
          name: ubuntu-latest

      - name: Download windows
        uses: actions/download-artifact@v7
        with:
          name: windows-latest

      # marvinpinto/action-automatic-releases moved the `latest` tag itself. The releases API
      # only creates a tag when it's missing, so without this the Development Build would stay
      # pinned to wherever `latest` already points. Falls back to creating it if it's ever
      # deleted.
      - name: Point the latest tag at this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api -X PATCH "repos/$REPO/git/refs/tags/latest" -f sha="$SHA" -F force=true ||
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/latest" -f sha="$SHA"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          prerelease: true
          name: Development Build
          files: |
            marked-space
            marked-space.exe
