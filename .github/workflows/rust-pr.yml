name: Rust PR

on:
  pull_request:
    branches: ["main"]

jobs:
  format:
    env:
      CARGO_TERM_COLOR: always
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Format
        run: cargo fmt --all -- --check
  # audit:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: EmbarkStudios/cargo-deny-action@v2
  build:
    name: "Build"
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    uses: ./.github/workflows/shared-build.yml
    with:
      os: ${{ matrix.os }}

  docker:
    name: "Docker"
    permissions:
      contents: read
      packages: write
      id-token: write
    needs: build
    uses: ./.github/workflows/shared-docker-publish.yml
    secrets: inherit
    with:
      push: false

  # Runs the action as it is defined in this branch, so that a change to action.yml is checked
  # before it's released. Forks don't get the credentials, hence the repository check.
  test_github_action:
    if: github.repository == 'james-allan-lloyd/marked-space'
    needs: docker
    runs-on: ubuntu-latest
    name: Generate example space using github action
    steps:
      - uses: actions/checkout@v4
      - name: Marked Space Test
        id: marked-space-test
        uses: ./
        with:
          space-directory: "example/team"
          confluence-host: ${{ vars.CONFLUENCE_HOST }}
          api-user: ${{ secrets.API_USER }}
          api-token: ${{ secrets.API_TOKEN }}
